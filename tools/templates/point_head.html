<style id="wontupoint-theme">
:root{--primary:#000000;--secondary:#000000;--accent:#000000;--light:#FFFFFF;--pale:#FFFFFF;--border:#FFFFFF;--page:#F7F8FA;}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:#252c34;font-family:'Noto Sans KR','Malgun Gothic',Arial,sans-serif;font-size:16px;line-height:1.85;word-break:keep-all;text-align:left}
.container{max-width:1104px;margin:35px auto;padding:42px 52px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.035)}
h1,h2,h3{width:auto;margin:0;font-family:inherit;line-height:1.4;letter-spacing:-.025em;word-break:keep-all;text-align:left}
h1{font-size:clamp(27px,4.5vw,36px);color:var(--primary);font-weight:800;margin-bottom:14px}
h2{font-size:clamp(22px,3.4vw,27px);color:var(--primary);font-weight:750;margin:24px 0 16px}
h3{font-size:clamp(19px,3vw,23px);color:var(--secondary);font-weight:750;margin:34px 0 22px;border-left:5px solid var(--accent);padding-left:15px;}
.section{margin:0 0 40px;padding:0}
p{width:auto!important;margin:0 0 19px!important;font-size:16px!important;line-height:1.9;text-align:left!important;word-break:keep-all}
.highlight{font-weight:700;color:var(--primary);font-size:inherit}
.intro-heading{margin-top:20px}
.conclusion-heading{margin-top:40px;padding-top:22px;border-top:2px solid var(--border)}
.section>br{display:none}
@media(max-width:700px){body{background:#fff}.container{padding:24px 19px;margin:0;max-width:100%;border:0;box-shadow:none;border-radius:0}.section{margin-bottom:28px}p{font-size:15.5px!important;line-height:1.83}h3{margin-top:27px}}
</style>
<!-- COLOR_THEME_V2_START -->
<style id="color-theme-v2">
body { color:#293640 !important; }
body h1,body .container h1 { color:#225032 !important; }
body h2,body .container h2 { color:#336B46 !important; }
body h3,body .container h3 { color:#225032 !important; border-bottom:2px solid #336B46 !important;padding-bottom:10px !important; }
body .highlight { color:#225032 !important;background-color:#EAF5EB !important; padding:0 3px; border-radius:3px; }
</style>
<!-- COLOR_THEME_V2_END -->
<!-- WONTU_TITLE_STYLE_START -->
<style id="wontu-title-style">
/* Space above and below the actual title, even if the intro shares its div. */
.container h1.wontu-point-title { padding:44px 0 40px !important; margin:0 !important; line-height:1.52; }
.wontu-title-divider { display:block; height:2px; border:0; background:#b9cfc0; margin:0 0 24px; }
@media(max-width:700px){
  .container h1.wontu-point-title { padding:30px 0 !important; }
  .wontu-title-divider { margin-bottom:18px; }
}
</style>
<!-- WONTU_TITLE_STYLE_END -->
