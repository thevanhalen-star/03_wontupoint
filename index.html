<script>
(() => {
  'use strict';
  const PAGE_SIZE = 9;
  const REGIONS = [
    ['전체', null], ['인천·경기', 'metro'], ['강원', '강원'], ['충남', '충남'],
    ['전북', '전북'], ['전남', '전남'], ['경북', '경북'], ['경남', '경남'],
    ['부산·울산', 'southeast'], ['제주', '제주']
  ];
  const UPDATING = ['강원','경북','southeast','제주'];
  const cityAlias = {'인천':'인천','인천광역시':'인천','경기':'경기','경기도':'경기','강원특별자치도':'강원','강원도':'강원','강원':'강원','충청남도':'충남','충남':'충남','충청북도':'충북','충북':'충북','전북특별자치도':'전북','전라북도':'전북','전북':'전북','전라남도':'전남','전남':'전남','경상북도':'경북','경북':'경북','경상남도':'경남','경남':'경남','부산광역시':'부산','부산':'부산','울산광역시':'울산','울산':'울산','제주특별자치도':'제주','제주':'제주'};
  let lastId='';try{lastId=sessionStorage.getItem('wontu-last')||'';}catch(e){}
  const el = id => document.getElementById(id);
  let all = [], expanded = false, activeRegion = null, activeCity = '', keyword = '', page = 1;
  const normalize = text => String(text || '').replace(/\s+/g,'').toLowerCase();
  const regionOf = address => cityAlias[String(address || '').trim().split(/\s+/)[0]] || '';
  const groupOf = item => {
    const r=regionOf(item.address);
    if(r==='인천'||r==='경기')return 'metro';
    if(r==='부산'||r==='울산')return 'southeast';
    return r;
  };
  const districtOf = item => {
    const parts=String(item.address || '').trim().split(/\s+/);
    // Ex: 충남 태안군, 인천 중구, 경기 안산시 단원구
    return parts.length>1 ? parts[1] : '';
  };
  const pointUrl = path => 'points/' + String(path || '').replace(/^\/+/, '');
  function visibleRegion(){return all.filter(item => activeRegion===null || groupOf(item)===activeRegion);}
  function filtered(){return visibleRegion().filter(item=> (!activeCity || districtOf(item)===activeCity) && (!keyword || normalize(item.name).includes(keyword) || normalize(item.address).includes(keyword)));}
  function make(tag, klass, content){const n=document.createElement(tag);if(klass)n.className=klass;if(content!==undefined)n.textContent=content;return n;}
  const regionEls=new Map();
  function buildRegions(){
    const parent=el('regionList');parent.replaceChildren();
    for(const [name,region] of REGIONS){
      const items=all.filter(item=>region===null||groupOf(item)===region);
      const b=make('button','region-btn');b.type='button';
      const cnt=make('span','region-count');
      if(UPDATING.includes(region)){cnt.append(make('small','upd','업데이트중'));}
      cnt.append(String(items.length));
      b.append(make('span','',name),cnt);
      b.addEventListener('click',()=>{
        if(activeRegion===region&&region!==null){expanded=!expanded;render();return;}
        activeRegion=region;expanded=true;activeCity='';clearSearch();page=1;render();if(region===null)closeMenu();
      });
      parent.append(b);
      const rec={btn:b,wrap:null,cities:new Map()};
      if(region!==null){
        const wrap=make('div','city-wrap'),box=make('div','city-list');
        const addCity=(label,city,n)=>{
          const c=make('button','city-btn');c.type='button';
          c.append(make('span','',label),make('span','region-count',String(n)));
          c.addEventListener('click',()=>{activeCity=city;clearSearch();page=1;render();closeMenu();});
          box.append(c);rec.cities.set(city,c);
        };
        addCity('전체','',items.length);
        const cities=[...new Set(items.map(districtOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
        for(const city of cities)addCity(city,city,items.filter(i=>districtOf(i)===city).length);
        wrap.append(box);parent.append(wrap);rec.wrap=wrap;
      }
      regionEls.set(region,rec);
    }
  }
  function renderRegions(){
    if(!regionEls.size)buildRegions();
    for(const [region,rec] of regionEls){
      const on=activeRegion===region;
      rec.btn.classList.toggle('active',on);rec.btn.setAttribute('aria-pressed',String(on));
      if(rec.wrap){
        rec.wrap.classList.toggle('open',on&&expanded);
        for(const [city,c] of rec.cities)c.classList.toggle('active',on&&activeCity===city);
      }
    }
  }
  function clearSearch(){keyword='';el('searchInput').value='';}
  function syncUrl(){
    const u=new URL(location.href);u.search='';
    if(activeRegion)u.searchParams.set('region',activeRegion);
    if(activeCity)u.searchParams.set('city',activeCity);
    if(keyword)u.searchParams.set('q',keyword);
    if(page>1)u.searchParams.set('page',String(page));
    history.replaceState(null,'',u);
  }
  const updating=()=>UPDATING.includes(activeRegion);
  function renderNotice(label,count){
    const box=el('updateNotice');
    if(!updating()||keyword){box.hidden=true;box.replaceChildren();return;}
    const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.setAttribute('viewBox','0 0 64 64');icon.setAttribute('class','notice-icon');icon.setAttribute('aria-hidden','true');
    icon.innerHTML='<path d="M6 40c8 0 11-9 21-9 8 0 11 6 21 2M6 50c8 0 11-8 21-8 8 0 11 6 21 0" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="46" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="4"/><path d="M46 11v5l3 3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>';
    const txt=make('div','notice-tx');
    txt.append(make('b','',label+' 포인트는 현재 업데이트 중입니다'),
      make('p','',count?'지금은 일부 포인트만 공개되어 있고, 사진과 안내를 계속 추가하고 있어요.':'사진과 안내를 정리하는 중이에요. 곧 새로운 포인트로 찾아뵙겠습니다.'));
    const dots=make('div','notice-dots');dots.setAttribute('aria-hidden','true');dots.append(make('i'),make('i'),make('i'));
    box.replaceChildren(icon,txt,dots);box.hidden=false;
  }
  function renderCards(items){
    const parent=el('cards');parent.replaceChildren();
    if(!items.length&&updating()&&!keyword)return; // 업데이트중 지역은 아래 안내 문구로 대체
    if(!items.length){parent.append(make('div','empty',all.length?'검색 조건에 맞는 포인트가 없습니다.':'포인트 데이터를 불러오지 못했습니다.'));return;}
    for(const item of items){
      const a=make('a','point-card'+(item.id===lastId?' last':''));a.href=pointUrl(item.url);
      a.addEventListener('click',()=>{lastId=item.id;document.querySelectorAll('.point-card.last').forEach(c=>c.classList.remove('last'));a.classList.add('last');try{sessionStorage.setItem('wontu-last',item.id);}catch(e){}});a.title=item.name+' — '+item.address;
      const img=make('img','point-photo');img.src=pointUrl(item.image);img.alt=item.name+' 포인트 사진';img.loading='lazy';img.decoding='async';
      img.addEventListener('error',()=>{img.style.background='#e8eff4';img.alt='이미지를 불러올 수 없습니다';},{once:true});
      const info=make('div','card-info');info.append(make('div','point-name',item.name),make('div','point-address',item.address));
      a.append(img,info);parent.append(a);
    }
  }
  function renderPages(total){
    const nav=el('pagination');nav.replaceChildren();
    const pageCount=Math.max(1,Math.ceil(total/PAGE_SIZE));page=Math.max(1,Math.min(page,pageCount));
    if(total===0)return;
    const add=(label,n,disabled,active)=>{
      const b=make('button',active?'active':'',label);b.type='button';b.disabled=disabled;
      if(active)b.setAttribute('aria-current','page');
      b.addEventListener('click',()=>{page=n;render();window.scrollTo({top:0,behavior:'smooth'});});nav.append(b);
    };
    add('이전',page-1,page===1,false);
    let start=Math.max(1,page-2),end=Math.min(pageCount,start+4);start=Math.max(1,end-4);
    if(start>1){add('1',1,false,page===1);if(start>2)nav.append(make('span','','…'));}
    for(let p=start;p<=end;p++)add(String(p),p,false,p===page);
    if(end<pageCount){if(end<pageCount-1)nav.append(make('span','','…'));add(String(pageCount),pageCount,false,page===pageCount);}
    add('다음',page+1,page===pageCount,false);
  }
  function render(){
    renderRegions();
    const regionLabel=REGIONS.find(([,value])=>value===activeRegion)?.[0] || '전체';
    el('sectionTitle').textContent=(regionLabel==='전체'?'전체':regionLabel+(activeCity?' '+activeCity:''))+' 포인트';
    const data=filtered();
    el('count').textContent='총 '+data.length.toLocaleString('ko-KR')+'개';
    page=Math.max(1,Math.min(page,Math.max(1,Math.ceil(data.length/PAGE_SIZE))));
    renderCards(data.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE));renderPages(data.length);renderNotice(regionLabel,data.length);syncUrl();
  }
  function closeMenu(){el('sidebar').classList.remove('open');el('shade').classList.remove('open');}
  el('menuButton').addEventListener('click',()=>{el('sidebar').classList.toggle('open');el('shade').classList.toggle('open');});
  el('shade').addEventListener('click',closeMenu);
  el('searchForm').addEventListener('submit',e=>{e.preventDefault();keyword=el('searchInput').value.trim();page=1;render();});
  el('searchInput').addEventListener('input',e=>{keyword=e.target.value.trim();page=1;render();});
  const current=new URL(location.href);
  const presetRegion=current.searchParams.get('region');
  if(REGIONS.some(([,v])=>v===presetRegion)){activeRegion=presetRegion;expanded=presetRegion!==null;}
  activeCity=current.searchParams.get('city')||'';
  page=parseInt(current.searchParams.get('page'),10)||1;
  const presetQuery=current.searchParams.get('q');
  if(presetQuery){keyword=presetQuery;el('searchInput').value=presetQuery;}
  addEventListener('pageshow',e=>{if(e.persisted){const lc=document.querySelector('.point-card.last');if(lc)lc.scrollIntoView({block:'center'});}});
  fetch('./points.json',{cache:'no-cache'})
    .then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();})
    .then(data=>{
      if(!Array.isArray(data))throw Error('JSON 배열이 아닙니다.');
      all=data.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&typeof x.address==='string'&&typeof x.url==='string'&&typeof x.image==='string');
      render();
      const lc=document.querySelector('.point-card.last');if(lc)lc.scrollIntoView({block:'center'});
    })
    .catch(e=>{console.error('points.json 불러오기 실패:',e);el('cards').replaceChildren(make('div','empty','points.json 파일을 불러올 수 없습니다. 로컬 서버 또는 웹사이트 주소로 열어 주세요.'));el('count').textContent='데이터 오류';});
})();
</script>
</body>
</html>
